[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spikingnav"
version = "0.1.0"
description = "Simulation reproduction of SpikingNav (arXiv:2608.05078)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=1.12",
    "torchvision>=0.13",
    "numpy>=1.21",
    "gym>=0.17,<0.26",
    "opencv-python>=4.5",
    "scipy>=1.7",
    "scikit-image>=0.19",
    "Pillow>=8.0",
    "tqdm",
    "tensorboardX",
]

[project.optional-dependencies]
sim = [
    "ai2thor>=2.7.4",
]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["spikingnav*", "projects*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
